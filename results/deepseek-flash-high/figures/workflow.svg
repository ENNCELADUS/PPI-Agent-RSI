xt><text x="674" y="768" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5b4f45" text-anchor="start" font-weight="normal" xml:space="preserve">     every previously tested RP-RP pair in this</text><text x="674" y="785" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5b4f45" text-anchor="start" font-weight="normal" xml:space="preserve">     screen was a hit.&quot;},</text><text x="674" y="802" font-family="Menlo, Consolas, monospace" font-size="11.5" fill="#5b4f45" text-anchor="start" font-weight="normal" xml:space="preserve">  ... 199 more pairs ])</text><text x="910.0" y="938" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal" >Pairs to test in the next round (run r0, round 3)</text><path d="M716 922 L716 810" fill="none" stroke="#857464" stroke-width="1.2" marker-end="url(#ab)"/></svg>
