, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#857464" text-anchor="middle" font-weight="normal">200 pairs, each with</text><text x="472" y="336.45" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#857464" text-anchor="middle" font-weight="normal">probability, uncertainty,</text><text x="472" y="354.675" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#857464" text-anchor="middle" font-weight="normal">evidence, rationale</text><text x="731" y="352" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7d6e61" text-anchor="middle" font-weight="normal">no submission: one</text><text x="731" y="368" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#7d6e61" text-anchor="middle" font-weight="normal">fixed reminder, then empty</text><path d="M572 326 L928 326 L928 284" fill="none" stroke="#857464" stroke-width="2.2" marker-end="url(#ab)"/><rect x="880" y="110" width="290" height="170" fill="#f3ede0" stroke="#857464" stroke-width="3"/><text x="1025" y="140" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#857464" text-anchor="middle" font-weight="bold">Harness ends round t</text><text x="1025" y="172.0" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">Session aborted at submission</text><text x="1025" y="192.25" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">First 200 rows; invalid = miss</text><text x="1025" y="212.5" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">Lab (oracle): hit / not detected</text><text x="1025" y="252" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">Results → memory</text><path d="M1025 280 L1025 430 L150 430 L150 284" fill="none" stroke="#857464" stroke-width="3" marker-end="url(#ab)"/><rect x="420" y="418" width="360" height="24" fill="#f3ede0"/><text x="600" y="435" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" fill="#857464" text-anchor="middle" font-weight="normal">round t + 1: memory grows, tested pairs leave the pool</text><path d="M472 400 L60 492 M728 400 L1140 492" stroke="#a3477b" stroke-width="1.2" fill="none"/><rect x="60" y="492" width="1080" height="140" fill="#f3ede0" stroke="#a3477b" stroke-width="2"/><text x="600" y="520" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" fill="#a3477b" text-anchor="middle" font-weight="normal">Workflow the system prompt suggests (nothing enforces it)</text><rect x="80" y="540" width="188" height="72" fill="#f3ede0" stroke="#857464" stroke-width="2"/><text x="96" y="562" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#a3477b" text-anchor="start" font-weight="bold">1</text><text x="180" y="568.0" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#857464" text-anchor="middle" font-weight="normal">Read the task</text><text x="180" y="586.225" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" fill="#857464" text-anchor="middle" font-weight="normal">and round number</text><path d="M268 576 L288 576" fill="none" stroke="#857464" stroke-width="1.6" marker-end="url(#ab)"/><rect x="292" y="540" width="188" height="72" fill="#f3ede0" stroke="#857464" stroke-width="2"/><text x="308" y="562" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#a3477b" text-anchor="start" font-weight="bold">2</text><text x="392" y=