<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660"><rect width="1200" height="660" fill="#f3ede0"/><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#857464"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3477b"/></marker></defs><text x="600" y="34" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#857464" text-anchor="middle" font-weight="normal">One round t of the agent</text><rect x="30" y="110" width="240" height="170" fill="#f3ede0" stroke="#857464" stroke-width="3"/><text x="150" y="140" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#857464" text-anchor="middle" font-weight="bold">Harness starts round t</text><text x="150" y="172.0" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">New LLM session,</text><text x="150" y="192.25" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">no chat history</text><text x="150" y="212.5" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">System prompt +</text><text x="150" y="232.75" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">“Round t of 10;</text><text x="150" y="253.0" font-family="Myriad Pro, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#857464" text-anchor="middle" font-weight="normal">N pairs tested”</text><path d="M270 195 L346 195" fill="none" stroke="#857464" stroke-width="2.2" marker-end="url(#ab)"/><text x="6