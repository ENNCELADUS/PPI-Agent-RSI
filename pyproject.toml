[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ppi-agent-rsi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "pandas>=3.1.0",
]

[project.optional-dependencies]
predictor = ["numpy>=1.26", "torch>=2.4"]  # src/predictor: uv sync --extra predictor
dgcnn = ["torch>=2.4,<2.11", "torch-geometric>=2.5", "scipy", "scikit-learn", "fair-esm"]  # src/baselines/dgcnn (SEAL)

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.8"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["data/", "docs/", "literature/", "src/baselines/dgcnn/model.py", "src/baselines/dgcnn/core.py", "src/baselines/dgcnn/run.py"]  # vendored verbatim

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
