# model section of configs/split_seed42/b0_v31.yaml, motif-graph-prompt-tuning-for-inductive-protein-protein-interaction-prediction@bb01ee1 (equals best.pt's embedded model_config)
model:
  family: v3_1
  config:
    input_dim: 1536
    d_model: 512
    encoder_layers: 3
    cross_attn_layers: 3
    n_heads: 8
    mlp_head:
      hidden_dims: [512, 256, 128]
      dropout: 0.2
      activation: gelu
      norm: layernorm
      spectral_norm: false
    regularization:
      dropout: 0.1
      token_dropout: 0.1
      cross_attention_dropout: 0.1
      stochastic_depth: 0.1
    rich_pooling:
      components: [mean, attn, max, gated]
    pair_readout:
      mode: pair_context_gated
      order_aggregation: abba_max
      spectral_norm: false
    mixing:
      mode: none
    label_smoothing: 0.0 # hard labels, matching the Full-Ego task loss
    positive_weight: 5.0 # balances the 1:5 dynamic training stream
